[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dflow"
version = "0.1.0"
description = "Digital Flow Manager"
authors = [
    {name="Michael Hany"}
]

dependencies = [
    "typer",
    "pyyaml",
    "click"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
dflow = "dflow.cli:app"

[tool.setuptools.packages.find]
include = ["dflow*"]
exclude = ["Dflow_project_examples*", "tests*"]
